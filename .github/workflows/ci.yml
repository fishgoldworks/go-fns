name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04 # Supported by the pinned Playwright version.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '8.0.0'
      - run: echo "GO_FNS_NODE8=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r test/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - run: npm run verify:all
      - run: npm run docs
      - run: git diff --exit-code -- README.md docs/API.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: artifacts/*
          if-no-files-found: error
  contributor-floor:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '8.0.0'
      - run: echo "GO_FNS_NODE8=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: artifacts
      - name: Verify contributor floor and native coverage against the same candidate
        run: |
          archive="artifacts/go-fns-$(node -p 'require("./package.json").version').tgz"
          test -f "$archive.sha256"
          npm run verify:native -- --tarball "$archive"
  consumers:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['8.0.0', '12.20.0', '13.0.0', '14.13.0', '18.x', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: echo "CONSUMER_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: artifacts
      - name: Verify transferred bytes and installed consumers
        run: |
          archive="artifacts/go-fns-$(node -p 'require("./package.json").version').tgz"
          test -f "$archive.sha256"
          npm run test:package -- --tarball "$archive" --node "$CONSUMER_NODE"
  typescript-compatibility:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        typescript: ['5.4.5', '5.8.3']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: artifacts
      - name: Install isolated compiler and the verified candidate
        shell: bash
        run: |
          archive="$PWD/artifacts/go-fns-$(node -p 'require("./package.json").version').tgz"
          (cd artifacts && sha256sum --check "$(basename "$archive").sha256")
          npm install --prefix "$RUNNER_TEMP/type-compiler" --ignore-scripts --no-audit --no-fund --package-lock=false typescript@${{ matrix.typescript }}
          npm install --prefix "$RUNNER_TEMP/type-consumer" --offline --ignore-scripts --no-audit --no-fund --package-lock=false "$archive"
      - name: Check shared inference and rejection fixtures
        run: npm run test:types -- --compiler "${{ runner.temp }}/type-compiler/node_modules/typescript/lib/tsc.js" --package "${{ runner.temp }}/type-consumer/node_modules/go-fns"
      - name: Repeat installed runtime and package checks with this compiler
        env:
          TYPESCRIPT_COMPILER: ${{ runner.temp }}/type-compiler/node_modules/typescript/lib/tsc.js
        run: npm run test:package -- --tarball "artifacts/go-fns-$(node -p 'require("./package.json").version').tgz"
