name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '8.0.0'
      - run: echo "GO_FNS_NODE8=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r test/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run verify:all
      - run: npm run docs
      - run: git diff --exit-code -- README.md docs/API.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/*
          if-no-files-found: error
  consumers:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['8.0.0', '12.20.0', '13.0.0', '14.13.0', '18.x', '20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: echo "CONSUMER_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts
      - name: Verify transferred bytes and installed consumers
        run: npm run test:package -- --node "$CONSUMER_NODE"
  type-floor:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.4.5
      - run: npm run test:types
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: artifacts
      - run: npm run test:package
